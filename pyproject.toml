[project]
name = "laptop-deal-collector"
version = "0.1.0"
description = "Responsible source collection and normalization for Laptop Deal Intelligence"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "httpx>=0.28.1,<1",
  "pydantic>=2.10.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4,<9", "pytest-cov>=6.0.0,<7", "ruff>=0.8.4,<1"]

[project.scripts]
collect-laptops = "collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

